# ==============================================================================
# KEYBIND QOL SETTINGS
# ==============================================================================
# Change prefix mapping to Shift+Space
set -g prefix S-Space
unbind C-b
bind S-Space send-prefix

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Switch panes using Alt (Meta) + Arrow keys without needing the prefix
bind -n M-Right select-pane -R
bind -n M-Left select-pane -L
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Hard lockdown on window names (prevents processes from overriding your Git script)
set-option -g allow-rename off
set-window-option -g automatic-rename off

# ==============================================================================
# 1. CORE INTERACTION & MOUSE
# ==============================================================================
set -g mouse on

# Whitespace and brackets split words, so double-click selects whole paths/URLs.
set -g word-separators ' (){}[]'

# Double-click selects a word and copies it to the macOS clipboard.
bind -n DoubleClick1Pane \
    select-pane \; copy-mode -M \; send-keys -X select-word \; \
    send-keys -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode    DoubleClick1Pane \
    select-pane \; send-keys -X select-word \; \
    send-keys -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane \
    select-pane \; send-keys -X select-word \; \
    send-keys -X copy-pipe-no-clear "pbcopy"

# Drag-to-select also copies on release, then exits copy-mode.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Forward modifier+key combos (e.g. Shift+Enter) through to apps via CSI-u.
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ==============================================================================
# 2. CONTEXT & DIRECTORY SYNC
# ==============================================================================
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind y setw synchronize-panes

# ==============================================================================
# 3. CUSTOM AUTOMATED LAYOUTS (Prefix + m, then 1 or 2)
# ==============================================================================

# Step A: Tell 'Prefix + m' to pause and listen for a key from our custom "macros" table
bind m switch-client -T macros

# Layout 1: Two rows, larger bottom row (60% height) -> Prefix + m, then 1
bind-key -T macros 1 new-window -c "#{pane_current_path}" \; \
                     split-window -v -p 60 -c "#{pane_current_path}" \; \
                     select-pane -t 1

# Layout 2: Two rows, two columns on top row. Bottom row is larger (65% height) -> Prefix + m, then 2
bind-key -T macros 2 new-window -c "#{pane_current_path}" \; \
                     split-window -v -p 65 -c "#{pane_current_path}" \; \
                     select-pane -t 1 \; \
                     split-window -h -c "#{pane_current_path}" \; \
                     select-pane -t 1

# ==============================================================================
# 4. STATUS BAR / TAB COLORS
# ==============================================================================
# Uses ANSI color names so the status bar inherits Ghostty's palette, matching
# the prompt's color vocabulary (see vcs_info_prompt.zsh).
set -g status-style                'bg=default fg=white'
set -g window-status-current-style 'fg=blue bold bg=brightblack'
set -g window-status-style         'fg=brightblack'
set -g window-status-format         ' #I #W '
set -g window-status-current-format ' #I #W '
set -g status-left  '#[fg=green,bold] #S #[fg=brightblack]│ '
set -g status-left-length 20
set -g status-right-length 200
set -g pane-border-style        'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style            'fg=yellow'

# ==============================================================================
# 5. GITMUX
# ==============================================================================
set -g status-right '#(~/dotfiles/tmux/gitmux-wrapper.sh "#{pane_current_path}") #[fg=brightblack] %-I:%M %p  %d-%b '
